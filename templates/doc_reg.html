{% include 'header.html' %}
<script>document.title = "Doctor Registration - KnowURmed";</script>
<section id="hero" class="hero section">
    <div class="container">
        <div class="row align-items-center">
            <div class="col-lg-5">
                <div class="hero-image" data-aos="fade-right" data-aos-delay="100">
                    <img src="/static/assets/img/health/staff-8.webp" alt="Healthcare Professional"
                         class="img-fluid main-image">
                    <div class="floating-card emergency-card" data-aos="fade-up" data-aos-delay="300">
                        <div class="card-content">
                            <i class="bi bi-telephone-fill"></i>
                            <div class="text">
                            </div>
                        </div>
                    </div>
                    <div class="floating-card stats-card" data-aos="fade-up" data-aos-delay="400">
                        <div class="stat-item">
                        </div>
                        <div class="stat-item">
                            <span class="number">98%</span>
                            <span class="label">Satisfaction Rate</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-lg-7">
                <div class="hero-content" data-aos="fade-left" data-aos-delay="200">
                    <div class="hero-stats">
                        <div class="stat-group">
                            <div class="stat">
                                <i class="bi bi-award"></i>
                                <div class="stat-text">
                                    <span class="number">35+</span>
                                    <span class="label">Years Experience</span>
                                </div>
                            </div>
                            <div class="stat">
                                <i class="bi bi-people"></i>
                                <div class="stat-text">
                                    <span class="number">150+</span>
                                    <span class="label">Medical Specialists</span>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="card shadow-sm border-0 p-4">
                        <h1 class="h3 mb-4">Doctor Registration</h1>
                        <form method="post" action="{% url 'doc_reg' %}">
                            {% csrf_token %}
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label">Username</label>
                                    <input type="text" class="form-control" name="username" placeholder="enter username" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Full Name</label>
                                    <input type="text" class="form-control" name="name" placeholder="enter your full name" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Email</label>
                                    <input type="email" class="form-control" name="email" placeholder="enter your email" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Phone</label>
                                    <input type="text" class="form-control" name="phone" placeholder="enter phone number" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Specialization</label>
                                    <input type="text" class="form-control" name="specialization" placeholder="enter your specialization" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Password</label>
                                    <input type="password" class="form-control" name="password" placeholder="enter password" required>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-primary mt-4">Confirm</button>
                        </form>
                        <p class="text-center mt-3 mb-0">
                            Already have an account? <a href="{% url 'login' %}">Login</a>
                            &middot; Registering as a patient? <a href="{% url 'registration' %}">Patient Registration</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="background-elements">
        <div class="bg-shape shape-1"></div>
        <div class="bg-shape shape-2"></div>
        <div class="bg-pattern"></div>
    </div>
</section>

{% include 'footer.html' %}
