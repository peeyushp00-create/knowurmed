{% include 'docter_header.html' %}

<section class="hero section">
<div class="container">
<h2 class="mb-4">My Schedule</h2>
<div class="table-responsive bg-white rounded shadow-sm p-3">
<table class="table table-bordered table-hover align-middle mb-0">
    <tr>
        <th>Patient</th>
        <th>Date</th>
        <th>Time</th>
        <th>Status</th>
    </tr>

    {% for appt in appointments %}
    <tr>
        <td>{{ appt.user.user_id.username }}</td>
        <td>{{ appt.date }}</td>
        <td>{{ appt.time }}</td>
        <td><span class="badge bg-success">{{ appt.status }}</span></td>
    </tr>
    {% empty %}
    <tr><td colspan="4" class="text-center">No approved appointments yet.</td></tr>
    {% endfor %}
</table>
</div>
</div>
</section>

{% include 'footer.html' %}
