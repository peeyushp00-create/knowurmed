{% include 'doctor_header.html' %}
<script>document.title = "Patient Feedback - KnowURmed";</script>

<section class="hero section">
<div class="container">
<h2 class="mb-4">Patient Feedback</h2>
<div class="table-responsive bg-white rounded shadow-sm p-3">
<table class="table table-bordered table-hover align-middle mb-0">
    <tr>
        <th>Patient</th>
        <th>Feedback</th>
        <th>Date</th>
    </tr>

    {% for f in feedback_list %}
    <tr>
        <td>{{ f.user.user_id.username }}</td>
        <td>{{ f.feedback }}</td>
        <td>{{ f.date }}</td>
    </tr>
    {% empty %}
    <tr><td colspan="3" class="text-center">No feedback submitted yet.</td></tr>
    {% endfor %}
</table>
</div>
</div>
</section>

{% include 'footer.html' %}
