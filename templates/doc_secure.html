{% include 'docter_header.html' %}
<script>document.title = "Change Password - KnowURmed";</script>

<section class="hero section">
<div class="container">
<div class="card shadow-sm border-0 p-4" style="max-width:420px;">
<h2 class="h3 mb-4">Change Password</h2>
<form method="post" action="{% url 'doc_secure' %}">
    {% csrf_token %}
    <div class="mb-3">
        <label class="form-label">Current Password</label>
        <input type="password" class="form-control" name="current_password" required>
    </div>
    <div class="mb-3">
        <label class="form-label">New Password</label>
        <input type="password" class="form-control" name="new_password" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Confirm New Password</label>
        <input type="password" class="form-control" name="confirm_password" required>
    </div>
    <button type="submit" class="btn btn-primary w-100">Update Password</button>
</form>
</div>
</div>
</section>

{% include 'footer.html' %}
