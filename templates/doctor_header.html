<body class="index-page">

  <header id="header" class="header d-flex align-items-center fixed-top">
    <div class="container position-relative d-flex align-items-center justify-content-between">

      <a href="{% url 'doctor_home' %}" class="logo d-flex align-items-center me-auto me-xl-0">
        <!-- Uncomment the line below if you also wish to use an image logo -->
        <!-- <img src="/static/assets/img/logo.webp" alt=""> -->
        <h1 class="sitename">knowU<span>Rmed</span></h1>
      </a>

      <nav id="navmenu" class="navmenu">
        <ul>
          <li><a href="{% url 'doctor_home' %}" class="active">Home</a></li>
          <li><a href="{% url 'appoint_manage' %}">Appointments</a></li>
          <li><a href="{% url 'schedule' %}">Schedule</a></li>
          <li><a href="{% url 'doc_med' %}">Medicines</a></li>
          <li><a href="{% url 'doc_complaint' %}">Complaints</a></li>
          <li><a href="{% url 'doc_feedback' %}">Feedback</a></li>
          <li><a href="{% url 'doc_secure' %}">Change Password</a></li>
        </ul>
        <i class="mobile-nav-toggle d-xl-none bi bi-list"></i>
      </nav>

      <a class="btn-getstarted" href="{% url 'logout' %}">Logout</a>

    </div>
  </header>

  <main class="main">
  {% if messages %}
  <div class="container" style="margin-top:100px;">
    {% for message in messages %}
    <div style="padding:12px 16px;margin-bottom:10px;border-radius:6px;{% if message.tags == 'error' %}background:#fdecea;color:#611a15;border:1px solid #f5c2c0;{% else %}background:#e6f4ea;color:#1e4620;border:1px solid #b7dfc0;{% endif %}">
      {{ message }}
    </div>
    {% endfor %}
  </div>
  {% endif %}
